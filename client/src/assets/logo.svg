<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%">
  <!-- Background matching editor dark theme -->
  <rect width="100%" height="100%" fill="#1f242d"/>

  <g transform="translate(30, 20)">
    <!-- ==================== LEFT ICON: PERFECT EQUIDISTANT MESH ==================== -->
    <!-- Center laptop is placed at (90, 90). Radius to all 6 nodes is exactly 60px.
         All outer dots are uniformly spaced at 60° intervals (distance dot-to-dot = 60px). -->
    <g>
      <!-- Dot-to-Dot Perimeter Mesh Lines (Length: exactly 60px) -->
      <line x1="90" y1="30" x2="142" y2="60" stroke="#2ee56b" stroke-width="4" stroke-opacity="0.45" stroke-linecap="round"/>
      <line x1="142" y1="60" x2="142" y2="120" stroke="#2ee56b" stroke-width="4" stroke-opacity="0.45" stroke-linecap="round"/>
      <line x1="142" y1="120" x2="90" y2="150" stroke="#2ee56b" stroke-width="4" stroke-opacity="0.45" stroke-linecap="round"/>
      <line x1="90" y1="150" x2="38" y2="120" stroke="#2ee56b" stroke-width="4" stroke-opacity="0.45" stroke-linecap="round"/>
      <line x1="38" y1="120" x2="38" y2="60" stroke="#2ee56b" stroke-width="4" stroke-opacity="0.45" stroke-linecap="round"/>
      <line x1="38" y1="60" x2="90" y2="30" stroke="#2ee56b" stroke-width="4" stroke-opacity="0.45" stroke-linecap="round"/>

      <!-- Radial Lines: Center to Outer Dots (Length: exactly 60px) -->
      <line x1="90" y1="90" x2="90" y2="30" stroke="#2ee56b" stroke-width="6" stroke-linecap="round"/>
      <line x1="90" y1="90" x2="142" y2="60" stroke="#2ee56b" stroke-width="6" stroke-linecap="round"/>
      <line x1="90" y1="90" x2="142" y2="120" stroke="#2ee56b" stroke-width="6" stroke-linecap="round"/>
      <line x1="90" y1="90" x2="90" y2="150" stroke="#2ee56b" stroke-width="6" stroke-linecap="round"/>
      <line x1="90" y1="90" x2="38" y2="120" stroke="#2ee56b" stroke-width="6" stroke-linecap="round"/>
      <line x1="90" y1="90" x2="38" y2="60" stroke="#2ee56b" stroke-width="6" stroke-linecap="round"/>

      <!-- Uniform Outer Satellite Nodes (Radius: 12px) -->
      <circle cx="90" cy="30" r="12" fill="#2ee56b"/>
      <circle cx="142" cy="60" r="12" fill="#2ee56b"/>
      <circle cx="142" cy="120" r="12" fill="#2ee56b"/>
      <circle cx="90" cy="150" r="12" fill="#2ee56b"/>
      <circle cx="38" cy="120" r="12" fill="#2ee56b"/>
      <circle cx="38" cy="60" r="12" fill="#2ee56b"/>

      <!-- Central Laptop Device (Centered at 90, 90) -->
      <!-- Laptop Screen Bezel -->
      <rect x="71" y="73" width="38" height="24" rx="3" fill="#2ee56b"/>
      <!-- Inner Screen Cutout -->
      <rect x="74" y="76" width="32" height="18" rx="2" fill="#1f242d"/>
      <!-- Laptop Base / Keyboard -->
      <path d="M 64 100 C 64 97, 68 97, 72 97 L 108 97 C 112 97, 116 97, 116 100 L 118 104 C 118 106, 115 107, 111 107 L 69 107 C 65 107, 62 106, 62 104 Z" fill="#2ee56b"/>
      <!-- Trackpad Indent -->
      <rect x="86" y="99" width="8" height="2" rx="1" fill="#1f242d"/>
    </g>

    <!-- ==================== BRAND TYPOGRAPHY ==================== -->
    <!-- Main Title: CodeMesh -->
    <text x="205" y="105" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="600" letter-spacing="-1">
      <tspan fill="#ffffff">Code</tspan><tspan fill="#2ee56b">Mesh</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="210" y="148" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#f1f5f9" letter-spacing="0.2">
      Code, Chat and Collaborate. It&apos;s All in Mesh.
    </text>
  </g>
</svg>
